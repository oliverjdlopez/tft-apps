name: chattft-evals
x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: http://localhost:15500
  DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD:?Run chat-tft-evals up first}@postgres:5432/langfuse
  SALT: ${SALT:?}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_WEBHOOK_WHITELISTED_HOST: experiments
  LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST: experiments,${LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST:-}
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_AUTH: ${REDIS_AUTH:?}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
x-langfuse-dependencies: &langfuse-dependencies
  postgres:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy
services:
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.35.0
    restart: unless-stopped
    depends_on: *langfuse-dependencies
    ports: ["127.0.0.1:15500:3000"]
    environment:
      <<: *langfuse-environment
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      LANGFUSE_INIT_ORG_ID: chattft
      LANGFUSE_INIT_ORG_NAME: ChatTFT
      LANGFUSE_INIT_PROJECT_ID: chattft-evals
      LANGFUSE_INIT_PROJECT_NAME: ChatTFT evaluations
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-evals@chattft.local}
      LANGFUSE_INIT_USER_NAME: ChatTFT evaluator
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 30
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.35.0
    restart: unless-stopped
    depends_on:
      <<: *langfuse-dependencies
      langfuse-web:
        condition: service_healthy
    environment: *langfuse-environment
  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: langfuse
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 3s
      timeout: 3s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    volumes: ["clickhouse:/var/lib/clickhouse", "clickhouse-logs:/var/log/clickhouse-server"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_AUTH:?}
    command: ["redis-server", "--requirepass", "${REDIS_AUTH:?}", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio@sha256:ad4a4c0a39ad7b71408124fe3df07b1b2e9d2959a369fac8754d2ef3311b5c20
    restart: unless-stopped
    entrypoint: /bin/sh
    command: ["-c", "mkdir -p /data/langfuse && minio server --address :9000 /data"]
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
  mock-model:
    profiles: [test]
    image: chattft-evals-runner:local
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      PYTHONPATH: /workspace:/workspace/app/backend:/workspace/app/backend/src
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: ["../..:/workspace:ro"]
    command: ["python", "-m", "uvicorn", "evals.langfuse.tests.mock_model:app", "--host", "0.0.0.0", "--port", "8000"]
  experiments:
    command: ["python", "-m", "uvicorn", "evals.langfuse.proxy:app", "--host", "0.0.0.0", "--port", "80"]
    build:
      context: ../..
      dockerfile: evals/langfuse/Dockerfile
    image: chattft-evals-runner:local
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      langfuse-web:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      PYTHONPATH: /workspace:/workspace/app/backend:/workspace/app/backend/src
      PYTHONDONTWRITEBYTECODE: "1"
      CHAT_TFT_GIT_REVISION: ${CHAT_TFT_GIT_REVISION:-unknown}
      CHAT_TFT_WORKING_TREE_FINGERPRINT: ${CHAT_TFT_WORKING_TREE_FINGERPRINT:-unknown}
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_URL: http://localhost:15500
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?}
      LANGFUSE_EXPERIMENT_TOKEN: ${LANGFUSE_EXPERIMENT_TOKEN:?}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-evals@chattft.local}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?}
      LANGFUSE_SNAPSHOT_DIR: /workspace/evals/langfuse/snapshots
      LANGFUSE_RUNTIME_DIR: /runtime
      LANGFUSE_TEST_DEPLOYMENT: ${LANGFUSE_TEST_DEPLOYMENT:-0}
    volumes:
      - ../..:/workspace:ro
      - ./snapshots:/workspace/evals/langfuse/snapshots:rw
      - ./.runtime:/runtime:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres:
  clickhouse:
  clickhouse-logs:
  redis:
  minio:
