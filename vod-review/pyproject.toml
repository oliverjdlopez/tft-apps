[project]
name = "vod-review"
version = "0.1.0"
description = "Local VOD frame analysis and round-classification tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=13.0",
    "fastapi>=0.115",
    "filelock>=3.0",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "onnxruntime>=1.23; sys_platform == 'darwin'",
"onnxruntime-gpu>=1.23; sys_platform != 'darwin'",
    "paddleocr>=3.5",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "torch>=2.4",
    "ultralytics>=8.4",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1.0"]

[project.scripts]
start = "backend.__main__:main"
vod-review-start = "backend.start:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "round_classifier*", "text_detection*"]

[tool.pytest.ini_options]
pythonpath = ["."]
