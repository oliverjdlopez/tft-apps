name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tft-chat
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tft
          POSTGRES_PASSWORD: tft
          POSTGRES_DB: chat_tft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RDS_TEST_HOST: 127.0.0.1
      RDS_TEST_PORT: 5432
      RDS_TEST_ADMIN: tft
      RDS_TEST_DB: chat_tft_test
      RDS_TEST_PASSWORD: tft
      RDS_TEST_SYNC_LOCAL_IP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tft-chat/app/frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm --prefix app/frontend ci
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install declared ChatTFT test environment
        run: uv sync --locked --extra evals --extra compositions --group test
      - name: Offline tests, builds, coverage, and authored baselines
        run: python ../scripts/test_suite.py --tier offline --component chat --coverage
      - name: Required PostgreSQL integration
        run: python ../scripts/test_suite.py --tier postgres --component chat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chattft-validation
          path: |
            .runtime/validation
            dev/logs
            dev/traces
            dev/profiles
            tft-chat/dev/logs
            tft-chat/dev/traces
            tft-chat/dev/profiles
            vod-review/dev/logs
            vod-review/dev/traces
            vod-review/dev/profiles
            tft-chat/app/frontend/coverage

  langfuse-browser:
    env:
      LANGFUSE_TEST_DEPLOYMENT: "1"
    defaults:
      run:
        working-directory: tft-chat
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Start isolated Langfuse platform
        env:
          LANGFUSE_TEST_DEPLOYMENT: "1"
        run: uv run --locked --extra evals python -m evals up --no-browser
      - name: Install browser test runtime
        run: |
          npm --prefix /tmp/chattft-browser install playwright@1.58.2
          /tmp/chattft-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise native evaluation authoring and experiments
        env:
          PLAYWRIGHT_MODULE: /tmp/chattft-browser/node_modules/playwright/index.mjs
        run: node evals/langfuse/tests/browser-smoke.mjs
      - name: Exercise native judge scheduling without paid calls
        env:
          LANGFUSE_TEST_DEPLOYMENT: "1"
        run: uv run --locked --extra evals python evals/langfuse/tests/native-judge-smoke.py
      - name: Export a real development conversation with the local mock model
        run: |
          docker compose --env-file evals/langfuse/.env -f evals/langfuse/compose.yaml -f evals/langfuse/compose.test.yaml exec -T experiments python evals/langfuse/tests/development-smoke.py
          docker compose --env-file evals/langfuse/.env -f evals/langfuse/compose.yaml -f evals/langfuse/compose.test.yaml exec -T experiments cat /tmp/chattft-development-trace.json > /tmp/chattft-development-trace.json
      - name: Exercise native review and development regression replay
        run: node evals/langfuse/tests/browser-review.mjs
      - name: Verify completed spans survive application timeout
        run: |
          docker compose --env-file evals/langfuse/.env -f evals/langfuse/compose.yaml -f evals/langfuse/compose.test.yaml exec -T experiments python evals/langfuse/tests/trace-timeout-smoke.py
          docker compose --env-file evals/langfuse/.env -f evals/langfuse/compose.yaml -f evals/langfuse/compose.test.yaml exec -T experiments cat /tmp/chattft-timeout-trace.json > /tmp/chattft-timeout-trace.json
      - name: Export frozen definitions and reports
        if: always()
        run: uv run --locked --extra evals python -m evals export-workspace /tmp/chattft-workspace.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langfuse-browser-validation
          path: |
            /tmp/chattft-native-judge-report.json
            /tmp/chattft-development-trace.json
            /tmp/chattft-browser-review-report.json
            /tmp/chattft-timeout-trace.json
            /tmp/chattft-workspace.json
            /tmp/chattft-langfuse-*.png
            tft-chat/evals/langfuse/snapshots/*.json
      - name: Stop evaluation services
        if: always()
        run: uv run --locked --extra evals python -m evals down

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm --prefix ../tft-chat/app/frontend ci
      - name: Install the independent VOD environment for cross-backend media tests
        run: uv sync --project ../vod-review --locked
      - run: uv sync --project ../tft-chat --locked --extra evals --extra compositions --group test
      - run: python ../scripts/test_suite.py --tier offline --component desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-validation
          path: |
            .runtime/validation
            dev/logs
            dev/traces
            dev/profiles
            tft-chat/dev/logs
            tft-chat/dev/traces
            tft-chat/dev/profiles
            vod-review/dev/logs
            vod-review/dev/traces
            vod-review/dev/profiles

  vod-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vod-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm --prefix frontend ci
      - run: uv sync --locked
      - run: python ../scripts/test_suite.py --tier offline --component vod --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vod-validation
          path: |
            .runtime/validation
            dev/logs
            dev/traces
            dev/profiles
            tft-chat/dev/logs
            tft-chat/dev/traces
            tft-chat/dev/profiles
            vod-review/dev/logs
            vod-review/dev/traces
            vod-review/dev/profiles
            vod-review/frontend/coverage

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --project tft-chat --locked --extra evals --extra compositions --group test
      - run: uv sync --project vod-review --locked
      - run: npm --prefix tft-chat/app/frontend ci
      - run: npm --prefix vod-review/frontend ci
      - run: npm --prefix tests/browser ci
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: python scripts/test_suite.py --tier browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: |
            .runtime/validation
            dev/logs
            dev/traces
            dev/profiles
            tft-chat/dev/logs
            tft-chat/dev/traces
            tft-chat/dev/profiles
            vod-review/dev/logs
            vod-review/dev/traces
            vod-review/dev/profiles

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg
      - run: uv sync --project tft-chat --locked --extra evals --extra compositions --group test
      - run: uv sync --project vod-review --locked
      - run: npm --prefix desktop ci
      - run: npm --prefix tft-chat/app/frontend ci
      - run: npm --prefix vod-review/frontend ci
      - run: xvfb-run -a python scripts/test_suite.py --tier native --component desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation
          path: |
            .runtime/validation
            dev/logs
            dev/traces
            dev/profiles
            tft-chat/dev/logs
            tft-chat/dev/traces
            tft-chat/dev/profiles
            vod-review/dev/logs
            vod-review/dev/traces
            vod-review/dev/profiles

  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core
      - run: uv sync --project tft-chat --locked --extra evals --extra compositions --extra eval-pdfs --group test
      - run: python scripts/test_suite.py --tier pdf --component chat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-validation
          path: |
            .runtime/validation
            dev/logs
            dev/traces
            dev/profiles
            tft-chat/dev/logs
            tft-chat/dev/traces
            tft-chat/dev/profiles
            vod-review/dev/logs
            vod-review/dev/traces
            vod-review/dev/profiles
